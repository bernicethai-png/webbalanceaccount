<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Webbalance 账务系统</title>
<link rel="icon" href="logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F2F5F4}
a{color:#1E7A62}a:hover{color:#155A48}
input,select{font:inherit}
table{border-collapse:collapse;width:100%}
th{font-weight:600;text-align:left;font-size:12px;color:#4B5563;padding:10px 12px;border-bottom:1px solid #E5E7EB;white-space:nowrap}
td{padding:12px;border-bottom:1px solid #EEF0F2;font-size:14px;white-space:nowrap;vertical-align:top}
</style>

</head>
<body>
<div id="app"></div>
<template id="app-tpl">
<div style="font-family: 'IBM Plex Sans','Noto Sans SC',sans-serif; color: #16202A; background: #F2F5F4; min-height: 100vh">
  <template data-sc="if" value="{{hasDlMsg}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 50; padding: 12px 20px; background: #16202A; color: #FFFFFF; border-radius: 8px; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.18)">{{dlMsg}}</div>
  </template>

  <template data-sc="if" value="{{showGate}}" hint-placeholder-val="{{ false }}">
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box">
      <section aria-label="登入" style="width: 100%; max-width: 400px; background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 12px; padding: 32px 28px; box-sizing: border-box">
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 22px">
          <img src="logo.png" alt="Webbalance logo" style="width: 52px; height: 52px">
          <div>
            <div style="font-weight: 700; font-size: 18px">Webbalance</div>
            <div style="font-size: 13px; color: #6B7280">账务系统</div>
          </div>
        </div>
        <template data-sc="if" value="{{gate.loading}}" hint-placeholder-val="{{ false }}">
          <div style="font-size: 14px; color: #4B5563">{{gate.loadingText}}</div>
        </template>
        <template data-sc="if" value="{{gate.form}}" hint-placeholder-val="{{ true }}">
          <h1 style="margin: 0 0 16px; font-size: 20px">{{gate.title}}</h1>
          <div style="display: flex; flex-direction: column; gap: 12px">
            <template data-sc="if" value="{{gate.askEmail}}" hint-placeholder-val="{{ true }}">
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #374151">Email
                <input type="email" autocomplete="username" value="{{gate.email}}" onChange="{{gate.onEmail}}" style="padding: 10px 12px; border: 1px solid #D1D5DB; border-radius: 6px">
              </label>
            </template>
            <template data-sc="if" value="{{gate.askPw}}" hint-placeholder-val="{{ true }}">
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #374151">{{gate.pwLabel}}
                <input type="password" autocomplete="{{gate.pwAuto}}" value="{{gate.pw}}" onChange="{{gate.onPw}}" style="padding: 10px 12px; border: 1px solid #D1D5DB; border-radius: 6px">
              </label>
            </template>
            <template data-sc="if" value="{{gate.askPw2}}" hint-placeholder-val="{{ false }}">
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #374151">再输入一次密码
                <input type="password" autocomplete="new-password" value="{{gate.pw2}}" onChange="{{gate.onPw2}}" style="padding: 10px 12px; border: 1px solid #D1D5DB; border-radius: 6px">
              </label>
            </template>
            <template data-sc="if" value="{{gate.hasErr}}" hint-placeholder-val="{{ false }}">
              <div role="alert" style="padding: 10px 12px; background: #FDECEC; color: #9B1C1C; border-radius: 6px; font-size: 13px">{{gate.err}}</div>
            </template>
            <template data-sc="if" value="{{gate.hasMsg}}" hint-placeholder-val="{{ false }}">
              <div role="status" style="padding: 10px 12px; background: #DDF2EA; color: #11603F; border-radius: 6px; font-size: 13px">{{gate.msg}}</div>
            </template>
            <button type="button" onClick="{{gate.submit}}" disabled="{{busy}}" style="padding: 11px 16px; background: #1E7A62; color: #FFFFFF; border: 0; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer">{{gate.submitLabel}}</button>
            <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px">
              <template data-sc="for" list="{{gate.links}}" as="k" hint-placeholder-count="2">
                <button type="button" onClick="{{k.go}}" style="padding: 6px 0; border: 0; background: none; color: #1E7A62; font: inherit; font-size: 13px; cursor: pointer">{{k.label}}</button>
              </template>
            </div>
          </div>
        </template>
      </section>
    </div>
  </template>

  <template data-sc="if" value="{{ready}}" hint-placeholder-val="{{ true }}">
  <div style="display: flex; flex-wrap: wrap; align-items: stretch; min-height: 100vh">
  <aside style="flex: 1 1 220px; max-width: 100%; background: #FFFFFF; border-right: 1px solid #E5E7EB; padding: 20px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 6px">
      <img src="logo.png" alt="Webbalance logo" style="width: 44px; height: 44px">
      <div>
        <div style="font-weight: 700; font-size: 16px">Webbalance</div>
        <div style="font-size: 12px; color: #6B7280">账务系统 · {{monthLabel}}</div>
      </div>
    </div>
    <nav aria-label="主菜单" style="display: flex; flex-direction: column; gap: 2px; border-top: 3px solid #7BCAAC; padding-top: 14px">
      <template data-sc="for" list="{{tabs}}" as="t" hint-placeholder-count="8">
        <button type="button" onClick="{{t.go}}" aria-current="{{t.current}}" style="{{t.style}}">
          <span style="{{t.dot}}"></span>{{t.label}}
        </button>
      </template>
    </nav>
    <div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 6px 0; border-top: 1px solid #EEF0F2">
      <div style="font-size: 12px; color: #4B5563">已登入</div>
      <div style="font-size: 13px; font-weight: 600; word-break: break-all">{{userEmail}}</div>
      <div style="font-size: 11px; color: #6B7280">{{loadedAt}}</div>
      <button type="button" onClick="{{reload}}" disabled="{{busy}}" style="padding: 8px 10px; background: #FFFFFF; color: #1E7A62; border: 1px solid #1E7A62; border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer; text-align: left">重新载入资料</button>
      <button type="button" onClick="{{exportAll}}" style="padding: 8px 10px; background: #FFFFFF; color: #374151; border: 1px solid #D1D5DB; border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer; text-align: left">下载备份（JSON）</button>
      <button type="button" onClick="{{logout}}" style="padding: 8px 10px; background: #FFFFFF; color: #9B1C1C; border: 1px solid #E8B4B4; border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer; text-align: left">登出</button>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 28px 64px; max-width: 1320px">

    <!-- ============ 总览 ============ -->
    <template data-sc="if" value="{{isDash}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 24px">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px">
          <div>
            <h1 style="margin: 0; font-size: 26px">总览 · {{monthLabel}}</h1>
            <p style="margin: 6px 0 0; color: #4B5563; font-size: 14px">开 Invoice 时就计入分账 · 未收款是全部未付清的 Invoice</p>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px">
          <template data-sc="for" list="{{kpis}}" as="k" hint-placeholder-count="4">
            <div style="background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 10px; padding: 18px 20px">
              <div style="font-size: 13px; color: #4B5563">{{k.label}}</div>
              <div style="font-family: 'IBM Plex Mono',monospace; font-size: 24px; font-weight: 500; margin-top: 8px">{{k.value}}</div>
              <div style="font-size: 12px; color: #6B7280; margin-top: 6px">{{k.sub}}</div>
            </div>
          </template>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 16px">
          <section style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 10px; padding: 20px">
            <h2 style="margin: 0 0 4px; font-size: 17px">利润分配（本月）</h2>
            <p style="margin: 0 0 18px; font-size: 13px; color: #4B5563">净利润 {{tot.net}} → 按每张单的来源分账 → 再从两人份额扣 Bernice 月薪 RM 500</p>
            <div style="display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: #E5E7EB">
              <div style="{{barCo}}"></div>
              <div style="{{barBernice}}"></div>
              <div style="{{barBalon}}"></div>
            </div>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 18px">
              <div style="border: 1px solid #BFE3D5; background: #EEF8F4; border-radius: 8px; padding: 14px 16px">
                <div style="font-size: 13px; color: #155A48; font-weight: 600">公司留存</div>
                <div style="font-family: 'IBM Plex Mono',monospace; font-size: 20px; margin-top: 6px">{{sal.coFinal}}</div>
                <div style="font-size: 12px; color: #2F5D50; margin-top: 6px; line-height: 1.5">10% 留存 {{tot.co}}<br>补贴月薪 −{{sal.fromCo}}<br>其他开销 −{{fund.exp}}</div>
              </div>
              <div style="border: 1px solid #F1D5C3; background: #FDF6F1; border-radius: 8px; padding: 14px 16px">
                <div style="font-size: 13px; color: #8A3B0E; font-weight: 600">Bernice 分红</div>
                <div style="font-family: 'IBM Plex Mono',monospace; font-size: 20px; margin-top: 6px">{{sal.bFinal}}</div>
                <div style="font-size: 12px; color: #6B4A36; margin-top: 6px; line-height: 1.5">分账 {{tot.bernice}} − 月薪分摊 {{sal.bDed}}<br><strong>连月薪实拿 {{sal.bTake}}</strong></div>
              </div>
              <div style="border: 1px solid #C9D6EE; background: #F3F6FC; border-radius: 8px; padding: 14px 16px">
                <div style="font-size: 13px; color: #1D4485; font-weight: 600">Balon 分红</div>
                <div style="font-family: 'IBM Plex Mono',monospace; font-size: 20px; margin-top: 6px">{{sal.baFinal}}</div>
                <div style="font-size: 12px; color: #3B4F72; margin-top: 6px; line-height: 1.5">分账 {{tot.balon}} − 月薪分摊 {{sal.baDed}}</div>
              </div>
            </div>
            <div style="margin-top: 12px; font-size: 12px; color: #4B5563">{{sal.note}}（月薪按两人当月分账比例分摊）</div>
          </section>

          <section style="flex: 1 1 320px; min-width: 0; background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 10px; padding: 20px">
            <h2 style="margin: 0 0 4px; font-size: 17px">公司户口（本月）</h2>
            <p style="margin: 0 0 14px; font-size: 13px; color: #4B5563">10% 留存，只在分账不够付月薪时才动用</p>
            <div style="display: flex; flex-direction: column; gap: 10px; font-size: 14px">
              <div style="display: flex; justify-content: space-between"><span>10% 留存收入</span><span style="font-family: 'IBM Plex Mono',monospace">{{fund.in}}</span></div>
              <div style="display: flex; justify-content: space-between; color: #9B1C1C"><span>− 补贴 Bernice 月薪</span><span style="font-family: 'IBM Plex Mono',monospace">{{sal.fromCo}}</span></div>
              <div style="display: flex; justify-content: space-between; color: #9B1C1C"><span>− 其他开销（礼物等）</span><span style="font-family: 'IBM Plex Mono',monospace">{{fund.exp}}</span></div>
              <div style="display: flex; justify-content: space-between; font-weight: 700; border-top: 1px solid #E5E7EB; padding-top: 10px"><span>本月结余</span><span style="{{fund.style}}">{{fund.bal}}</span></div>
            </div>
          </section>
        </div>

        <section style="background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 10px; padding: 20px">
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px">
            <h2 style="margin: 0; font-size: 17px">续约提醒 · {{renewSum.over}} 项已过期，{{renewSum.soon}} 项 30 天内到期</h2>
            <button type="button" onClick="{{goRenew}}" style="border: 0; background: none; color: #1E7A62; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 8px 0">全部 {{renewSum.yCount}} 项 · 年收 {{renewSum.yTotal}} →</button>
          </div>
          <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin-top: 12px">
            <template data-sc="for" list="{{alerts}}" as="r" hint-placeholder-count="6">
              <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 12px; border: 1px solid #EEF0F2; border-radius: 8px">
                <div style="min-width: 0">
                  <div style="font-size: 14px; font-weight: 500">{{r.item}}</div>
                  <div style="font-size: 12px; color: #6B7280; margin-top: 2px">{{r.customer}} · {{r.due}} · RM {{r.fee}}</div>
                </div>
                <span style="{{r.badgeStyle}}">{{r.badge}}</span>
              </div>
            </template>
          </div>
        </section>

      </div>
    </template>

    <!-- ============ 顾客 ============ -->
    <template data-sc="if" value="{{isCust}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 20px">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
          <div>
            <h1 style="margin: 0; font-size: 26px">顾客资料库</h1>
            <p style="margin: 6px 0 0; color: #4B5563; font-size: 14px">{{custCount}} 位顾客 · 从 Excel「Address」表导入</p>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 10px">
            <label for="csearch" style="position: absolute; left: -9999px">搜索顾客</label>
            <input id="csearch" value="{{q}}" onChange="{{onQ}}" placeholder="搜索公司名 / 电话 / 网站" style="padding: 10px 12px; border: 1px solid #D1D5DB; border-radius: 6px; min-width: 240px; background: #FFFFFF">
            <button type="button" onClick="{{toggleNewCust}}" style="padding: 10px 16px; background: #1E7A62; color: #FFFFFF; border: 0; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer">+ 新增顾客</button>
          </div>
        </div>

        <template data-sc="if" value="{{showNewCust}}" hint-placeholder-val="{{ false }}">
          <section style="background: #FFFFFF; border: 1px solid #1E7A62; border-radius: 10px; padding: 20px">
            <h2 style="margin: 0 0 16px; font-size: 17px">新增顾客</h2>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px">
              <template data-sc="for" list="{{ncFields}}" as="f" hint-placeholder-count="7">
                <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #374151">{{f.label}}
                  <input value="{{f.value}}" onChange="{{f.onChange}}" placeholder="{{f.ph}}" style="padding: 10px 12px; border: 1px solid #D1D5DB; border-radius: 6px">
                </label>
              </template>
            </div>

            <div style="margin-top: 22px; padding-top: 18px; border-top: 1px solid #E5E7EB">
              <h3 style="margin: 0 0 4px; font-size: 15px">续约项目</h3>
              <p style="margin: 0 0 12px; font-size: 13px; color: #4B5563">填了到期日的项目，保存后会自动出现在「续约」页，并在到期前 30 天提醒</p>
              <div style="display: flex; flex-direction: column; gap: 12px">
                <template data-sc="for" list="{{ncRows}}" as="r" hint-placeholder-count="1">
                  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; padding: 12px; background: #F7F8FA; border-radius: 8px">
                    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #374151; grid-column: span 2">项目 {{r.n}}
                      <input value="{{r.item}}" onChange="{{r.onItem}}" placeholder="www.xxx.com website hosting" style="padding: 10px 12px; border: 1px solid #D1D5DB; border-radius: 6px; background: #FFFFFF">
                    </label>
                    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #374151">每年收费 (MYR)
                      <input type="number" value="{{r.fee}}" onChange="{{r.onFee}}" placeholder="400" style="padding: 10px 12px; border: 1px solid #D1D5DB; border-radius: 6px; background: #FFFFFF; font-family: 'IBM Plex Mono',monospace">
                    </label>
                    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #374151">Hosting 成本 (MYR)
                      <input type="number" value="{{r.cost}}" onChange="{{r.onCost}}" placeholder="70" style="padding: 10px 12px; border: 1px solid #D1D5DB; border-radius: 6px; background: #FFFFFF; font-family: 'IBM Plex Mono',monospace">
                    </label>
                    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #374151">到期日
                      <input type="date" value="{{r.due}}" onChange="{{r.onDue}}" style="padding: 9px 12px; border: 1px solid #D1D5DB; border-radius: 6px; background: #FFFFFF">
                    </label>
                    <template data-sc="if" value="{{r.canRemove}}" hint-placeholder-val="{{ false }}">
                      <button type="button" onClick="{{r.remove}}" style="padding: 10px 12px; background: #FFFFFF; color: #9B1C1C; border: 1px solid #E8B4B4; border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer">移除</button>
                    </template>
                  </div>
                </template>
              </div>
              <button type="button" onClick="{{addRenRow}}" style="margin-top: 10px; padding: 8px 12px; background: #FFFFFF; color: #1E7A62; border: 1px dashed #1E7A62; border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer">+ 再加一个续约项目</button>
            </div>

            <template data-sc="if" value="{{hasNcErr}}" hint-placeholder-val="{{ false }}">
              <div role="alert" style="margin-top: 14px; padding: 10px 12px; background: #FDECEC; color: #9B1C1C; border-radius: 6px; font-size: 13px">{{ncErr}}</div>
            </template>
            <div style="display: flex; gap: 10px; margin-top: 18px">
              <button type="button" onClick="{{saveNew}}" style="padding: 10px 16px; background: #1E7A62; color: #FFFFFF; border: 0; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer">保存顾客</button>
              <button type="button" onClick="{{toggleNewCust}}" style="padding: 10px 16px; background: #FFFFFF; color: #374151; border: 1px solid #D1D5DB; border-radius: 6px; font: inherit; cursor: pointer">取消</button>
            </div>
          </section>
        </template>

        <template data-sc="if" value="{{hasNcMsg}}" hint-placeholder-val="{{ false }}">
          <div role="status" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; background: #DDF2EA; color: #11603F; border-radius: 8px; font-size: 14px">
            <span>✓ {{ncMsg}}</span>
            <div style="display: flex; gap: 8px">
              <button type="button" onClick="{{goRenewFromMsg}}" style="padding: 6px 12px; background: #1E7A62; color: #FFFFFF; border: 0; border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer">去续约页看看</button>
              <button type="button" onClick="{{closeMsg}}" aria-label="关闭" style="padding: 6px 10px; background: transparent; color: #11603F; border: 0; font: inherit; font-size: 13px; cursor: pointer">关闭</button>
            </div>
          </div>
        </template>

        <template data-sc="if" value="{{editing}}" hint-placeholder-val="{{ false }}">
          <section style="background: #FFFFFF; border: 1px solid #1E7A62; border-radius: 10px; padding: 20px">
            <h2 style="margin: 0 0 16px; font-size: 17px">编辑顾客 · {{editTitle}}</h2>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px">
              <template data-sc="for" list="{{editFields}}" as="f" hint-placeholder-count="4">
                <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #374151">{{f.label}}
                  <input value="{{f.value}}" onChange="{{f.onChange}}" style="padding: 10px 12px; border: 1px solid #D1D5DB; border-radius: 6px">
                </label>
              </template>
            </div>

            <div style="margin-top: 22px; padding-top: 18px; border-top: 1px solid #E5E7EB">
              <h3 style="margin: 0 0 4px; font-size: 15px">续约项目</h3>
              <p style="margin: 0 0 12px; font-size: 13px; color: #4B5563">改收费、成本或到期日，保存后续约页和提醒会一起更新</p>
              <div style="display: flex; flex-direction: column; gap: 12px">
                <template data-sc="for" list="{{editRows}}" as="r" hint-placeholder-count="2">
                  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; padding: 12px; background: #F7F8FA; border-radius: 8px">
                    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #374151; grid-column: span 2">项目 {{r.n}}
                      <input value="{{r.item}}" onChange="{{r.onItem}}" placeholder="www.xxx.com website hosting" style="padding: 10px 12px; border: 1px solid #D1D5DB; border-radius: 6px; background: #FFFFFF">
                    </label>
                    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #374151">每年收费 (MYR)

<script>
/* Webbalance 账务系统 — 本地版小型渲染器
 * 读取 <template id="app-tpl"> 里的界面模板（{{变量}}、data-sc="for"/"if"），
 * 每次 setState 后重新渲染，并只更新有变化的地方（输入框不会失去焦点）。
 * 资料存在浏览器的 localStorage（同一台电脑、同一个浏览器）。
 */
(function () {
  'use strict';
  var STORE_KEY = 'webbalance-local-v1';
  // 要保存的资料（界面状态如当前页面不保存）
  var PERSIST = window.WB_PERSIST || [];

  function DCLogic(props) { this.props = props || {}; this.state = {}; }
  DCLogic.prototype.setState = function (patch) {
    var p = typeof patch === 'function' ? patch(this.state) : patch;
    this.state = Object.assign({}, this.state, p);
    var touched = Object.keys(p || {}).some(function (k) { return PERSIST.indexOf(k) >= 0; });
    if (touched) save(this.state);
    schedule();
  };
  DCLogic.prototype.forceUpdate = function () { schedule(); };
  window.DCLogic = DCLogic;

  function save(st) {
    try {
      var out = { savedAt: new Date().toISOString() };
      PERSIST.forEach(function (k) { out[k] = st[k]; });
      localStorage.setItem(STORE_KEY, JSON.stringify(out));
    } catch (e) { /* 储存失败（例如隐私模式）时照常运作 */ }
  }
  function load() {
    try { var t = localStorage.getItem(STORE_KEY); return t ? JSON.parse(t) : null; } catch (e) { return null; }
  }
  window.WB_STORE = {
    key: STORE_KEY,
    exportJSON: function () { return localStorage.getItem(STORE_KEY) || '{}'; },
    reset: function () { try { localStorage.removeItem(STORE_KEY); } catch (e) {} location.reload(); }
  };

  // ---------- 模板求值 ----------
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var WHOLE = /^\{\{\s*([^}]+?)\s*\}\}$/;
  function lookup(path, scopes) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
    var parts = path.split('.');
    for (var i = scopes.length - 1; i >= 0; i--) {
      var sc = scopes[i];
      if (sc && Object.prototype.hasOwnProperty.call(sc, parts[0])) {
        var v = sc[parts[0]];
        for (var j = 1; j < parts.length; j++) { if (v == null) return undefined; v = v[parts[j]]; }
        return v;
      }
    }
    return undefined;
  }
  function interp(str, scopes) {
    return str.replace(HOLE, function (_, p) { var v = lookup(p, scopes); return v == null ? '' : String(v); });
  }

  // 把模板节点转成「虚拟节点」
  function build(node, scopes, out) {
    if (node.nodeType === 3) {
      var t = node.nodeValue;
      if (t.indexOf('{{') >= 0) t = interp(t, scopes);

    }

    var tag = node.tagName.toLowerCase();
    if (tag === 'template' && node.hasAttribute('data-sc')) {
      var kind = node.getAttribute('data-sc');
      if (kind === 'if') {
        var cond = node.getAttribute('value') || '';
        var m = cond.match(WHOLE), val = m ? lookup(m[1], scopes) : cond;
        if (val) kids(node.content, scopes, out);
      } else if (kind === 'for') {
        var lm = (node.getAttribute('list') || '').match(WHOLE);
        var list = lm ? lookup(lm[1], scopes) : null;
        var as = node.getAttribute('as') || 'item';
        (list || []).forEach(function (item, idx) {
          var sc = {}; sc[as] = item; sc.$index = idx;
          kids(node.content, scopes.concat([sc]), out);
        });
      }
      return;
    }
    var v = { tag: tag, attrs: {}, props: {}, events: {}, children: [] };
    for (var i = 0; i < node.attributes.length; i++) {
      var a = node.attributes[i], name = a.name, raw = a.value;
      if (name.indexOf('hint-') === 0) continue;
      if (/^on[a-z]+$/i.test(name)) {
        var mm = raw.match(WHOLE);
        var fn = mm ? lookup(mm[1], scopes) : null;
        if (typeof fn === 'function') {
          var ev = name.slice(2).toLowerCase();
          if (ev === 'change' && (tag === 'input' || tag === 'textarea') && node.getAttribute('type') !== 'checkbox') ev = 'input';
          v.events[ev] = fn;
        }
        continue;
      }
      var whole = raw.match(WHOLE);
      if (name === 'value' && (tag === 'input' || tag === 'select' || tag === 'textarea')) {
        var vv = whole ? lookup(whole[1], scopes) : interp(raw, scopes);
        v.props.value = vv == null ? '' : String(vv);
        continue;
      }
      if (name === 'disabled' || name === 'checked') {
        var b = whole ? lookup(whole[1], scopes) : true;
        if (b) v.attrs[name] = ''; v.props[name] = !!b;
        continue;
      }
      var val2 = whole ? lookup(whole[1], scopes) : (raw.indexOf('{{') >= 0 ? interp(raw, scopes) : raw);
      if (val2 == null || val2 === false) continue;
      v.attrs[name] = String(val2);
    }
    kids(tag === 'template' ? node.content : node, scopes, v.children);
    out.push(v);
  }
  function kids(parent, scopes, out) {
    for (var c = parent.firstChild; c; c = c.nextSibling) build(c, scopes, out);
  }

  // ---------- 把虚拟节点同步到画面 ----------
  var SVG_NS = 'http://www.w3.org/2000/svg';
  function create(v, inSvg) {
    if (v.text != null) return document.createTextNode(v.text);
    var svg = inSvg || v.tag === 'svg';
    var el = svg ? document.createElementNS(SVG_NS, v.tag) : document.createElement(v.tag);
    el.__ev = {};

  }
  function patchEl(el, v, svg) {
    var old = el.__attrs || {};
    Object.keys(old).forEach(function (k) { if (!(k in v.attrs)) el.removeAttribute(k); });
    Object.keys(v.attrs).forEach(function (k) { if (old[k] !== v.attrs[k]) el.setAttribute(k, v.attrs[k]); });
    el.__attrs = v.attrs;
    // events
    var evs = el.__ev || (el.__ev = {});
    Object.keys(evs).forEach(function (k) { if (!v.events[k]) { el.removeEventListener(k, evs[k].h); delete evs[k]; } });
    Object.keys(v.events).forEach(function (k) {
      if (!evs[k]) {
        var rec = { fn: v.events[k] };
        rec.h = function (e) { if (rec.fn) rec.fn(e); };
        el.addEventListener(k, rec.h); evs[k] = rec;
      } else evs[k].fn = v.events[k];
    });
    patchChildren(el, v.children, svg && v.tag !== 'foreignobject');
    if ('disabled' in v.props) el.disabled = v.props.disabled;
    if ('checked' in v.props) el.checked = v.props.checked;
    if ('value' in v.props && el.value !== v.props.value) el.value = v.props.value;
  }
  function same(dom, v) {
    if (v.text != null) return dom.nodeType === 3;
    return dom.nodeType === 1 && dom.tagName.toLowerCase() === v.tag;
  }
  function patchChildren(el, vkids, svg) {
    var doms = Array.prototype.slice.call(el.childNodes);
    for (var i = 0; i < vkids.length; i++) {
      var v = vkids[i], d = doms[i];
      if (d && same(d, v)) {
        if (v.text != null) { if (d.nodeValue !== v.text) d.nodeValue = v.text; }
        else patchEl(d, v, svg || v.tag === 'svg');
      } else {
        var n = create(v, svg);
        if (d) el.replaceChild(n, d); else el.appendChild(n);
      }
    }
    for (var j = doms.length - 1; j >= vkids.length; j--) el.removeChild(doms[j]);
  }

  // ---------- 启动 ----------
  var comp = null, root = null, tpl = null, pending = false;
  function render() {
    pending = false;
    var vals = comp.renderVals();
    var out = [];
    kids(tpl.content, [vals], out);
    patchChildren(root, out, false);
  }
  function schedule() { if (!pending && comp) { pending = true; (window.queueMicrotask || setTimeout)(render); } }

  window.WB_BOOT = function (Component) {
    tpl = document.getElementById('app-tpl');
    root = document.getElementById('app');
    comp = new Component({});
    var saved = load();
    if (saved) PERSIST.forEach(function (k) { if (saved[k] !== undefined && saved[k] !== null) comp.state[k] = saved[k]; });
    render();
    if (typeof comp.componentDidMount === 'function') comp.componentDidMount();
  };
})();

<script>
(function () {
// ===== Webbalance 账务系统 — 云端版逻辑 =====
// 资料存在 Supabase：customers / renewals / documents(invoice, quote) / payments / expenses

function pad2(n) { return (n < 10 ? '0' : '') + n; }
function parseD(s) { var p = String(s).slice(0, 10).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function iso(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function dmy(d) { return pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '/' + d.getFullYear(); }
function yymmdd(d) { return String(d.getFullYear()).slice(2) + pad2(d.getMonth() + 1) + pad2(d.getDate()); }
function addDays(isoStr, n) { var d = parseD(isoStr); d.setDate(d.getDate() + n); return iso(d); }
function addYear(isoStr) { var d = parseD(isoStr); d.setFullYear(d.getFullYear() + 1); return iso(d); }
function num(v) { var n = parseFloat(v); return isFinite(n) ? n : 0; }
function r2(n) { return Math.round(n * 100) / 100; }
function todayIso() { return iso(new Date()); }

// 分账规则
// 2026 起：Bernice 自接 → Bernice 先拿净利 50%；另外 50% 扣公司 10%，剩下 Bernice 45% / Balon 55%
//          Balon 自接 / 公司 / 续约 → 公司先扣 10%，剩下 Bernice 45% / Balon 55%
// 2025：一样，但不扣公司 10%（B0 / L0 / C0）
// 2020–2024：年底按余额 Bernice 40% / Balon 60%（OLD，只做记录）
// Bernice 月薪 RM 500：从当月两人分账按比例扣，不够才扣公司 10% 留存
var SALARY = 500;
function split(net, src) {
  if (src === 'OLD') return { co: 0, b: 0, ba: 0 };
  if (src === 'B0') return { co: 0, b: net * 0.5 + net * 0.5 * 0.45, ba: net * 0.5 * 0.55 };
  if (src === 'C0' || src === 'L0') return { co: 0, b: net * 0.45, ba: net * 0.55 };
  if (src === 'B') { var rest = net * 0.5, co = rest * 0.1, pool = rest - co; return { co: co, b: net * 0.5 + pool * 0.45, ba: pool * 0.55 }; }
  var co2 = net * 0.1, pool2 = net - co2;
  return { co: co2, b: pool2 * 0.45, ba: pool2 * 0.55 };
}
// 按单据日期决定实际规则
function effSrc(src, dateIso) {
  if (src === 'B0' || src === 'L0' || src === 'C0' || src === 'OLD') return src;
  var y = +String(dateIso).slice(0, 4);
  if (y < 2025) return 'OLD';
  if (y === 2025) return src === 'B' ? 'B0' : (src === 'L' ? 'L0' : 'C0');
  return src;
}

// ---------- Supabase ----------
var SB = null;
var DB = { customers: [], renewals: [], docs: [], payments: [], expenses: [] };
var TABLE = { customers: 'customers', renewals: 'renewals', docs: 'documents', payments: 'payments', expenses: 'expenses' };
function normRow(key, r) {
  if (!r) return r;
  ['fee', 'cost', 'total', 'amount'].forEach(function (k) { if (r[k] != null) r[k] = Number(r[k]); });
  if (key === 'docs' && !Array.isArray(r.lines)) r.lines = [];
  return r;
}
async function fetchAll(key) {
  var out = [], from = 0;
  for (;;) {
    var res = await SB.from(TABLE[key]).select('*').order('id').range(from, from + 999);
    if (res.error) throw res.error;
    out = out.concat(res.data.map(function (r) { return normRow(key, r); }));
    if (res.data.length < 1000) break;
    from += 1000;
  }
  return out;
}
async function loadAll() {
  var keys = Object.keys(TABLE);
  var res = await Promise.all(keys.map(fetchAll));
  keys.forEach(function (k, i) { DB[k] = res[i]; });
}
async function dbInsert(key, row) {
  var res = await SB.from(TABLE[key]).insert(row).select().single();
  if (res.error) throw res.error;
  var r = normRow(key, res.data); DB[key].push(r); return r;
}
async function dbUpdate(key, id, patch) {
  patch = Object.assign({}, patch);
  if (key !== 'payments' && key !== 'expenses') patch.updated_at = new Date().toISOString();
  var res = await SB.from(TABLE[key]).update(patch).eq('id', id).select().single();
  if (res.error) throw res.error;
  var r = normRow(key, res.data);
  DB[key] = DB[key].map(function (x) { return x.id === id ? r : x; });
  return r;
}
async function dbDelete(key, id) {
  var res = await SB.from(TABLE[key]).delete().eq('id', id);
  if (res.error) throw res.error;
  DB[key] = DB[key].filter(function (x) { return x.id !== id; });
}
function errText(e) {
  var m = (e && (e.message || e.error_description || e.msg)) || String(e);
  if (/duplicate key.*doc_no/i.test(m)) return '这个单号已经用过了，请换一个';
  if (/Invalid login credentials/i.test(m)) return '邮箱或密码不对';
  if (/Email not confirmed/i.test(m)) return '邮箱还没确认：请先到邮箱点确认链接';
  if (/User already registered/i.test(m)) return '这个邮箱已经设定过密码，请直接登入';
  if (/Password should be at least/i.test(m)) return '密码至少要 6 个字';
  if (/Failed to fetch|NetworkError/i.test(m)) return '连不上服务器，请检查网络';
  if (/row-level security/i.test(m)) return '这个账号没有权限';
  return m;
}
function newEditor(kind, custId) {
  var t = todayIso();
  return { kind: kind, id: null, no: '', noTouched: false, date: t, custId: custId != null ? String(custId) : '',
    lines: [{ desc: '', qty: '1', price: '' }], source: 'C', cost: '', status: '草稿', valid: addDays(t, 30),
    fromQuote: null, renewalId: null, err: '' };
}
function editorFromDoc(d) {
  return { kind: d.kind, id: d.id, no: d.doc_no, noTouched: true, date: d.doc_date, custId: d.customer_id != null ? String(d.customer_id) : '',
    lines: (d.lines.length ? d.lines : [{ desc: d.title || '', qty: 1, price: d.total }]).map(function (l) { return { desc: l.desc || '', qty: String(l.qty != null ? l.qty : 1), price: String(l.price != null ? l.price : '') }; }),
    source: ['B', 'L', 'C', 'R'].indexOf(d.source) >= 0 ? d.source : (d.source === 'OLD' ? 'C' : d.source.charAt(0)),
    rawSource: d.source, cost: d.cost ? String(d.cost) : '', status: d.status || '草稿',
    valid: d.valid_until || addDays(d.doc_date, 30), fromQuote: d.from_quote_id, renewalId: d.renewal_id, err: '' };
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      gate: 'loading', lg: { mode: 'login', email: '', pw: '', pw2: '', err: '', msg: '' }, userEmail: '', loadedAt: null,
      busy: false, tab: 'dash', dlMsg: '',
      src: 'B', sale: '100', cost: '0',
      q: '', showNewCust: false, nc: {}, ncRen: [{ item: '', fee: '', cost: '', due: '' }], ncErr: '', ncMsg: '',
      editId: null, draft: {}, draftRen: [], editErr: '', confirmDel: null,
      custDetail: null, backTab: null, divWho: 'all',
      ef: {}, expErr: '', expDel: null,
      edInv: newEditor('invoice'), edQuo: newEditor('quote'), payDate: todayIso(), payAmt: ''
    };
  }

  // ---------- 登入 / 载入 ----------
  componentDidMount() {
    var self = this;
    if (!window.supabase || !window.WB_CONFIG) { this.setState({ gate: 'error', fatal: '设定档缺少 Supabase 资料' }); return; }
    SB = window.supabase.createClient(WB_CONFIG.url, WB_CONFIG.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
    SB.auth.onAuthStateChange(function (event, session) {
      if (event === 'PASSWORD_RECOVERY') { self.setState({ gate: 'recovery', lg: Object.assign({}, self.state.lg, { err: '', msg: '' }) }); return; }
      if (event === 'SIGNED_OUT') { DB = { customers: [], renewals: [], docs: [], payments: [], expenses: [] }; self.setState({ gate: 'out', userEmail: '' }); return; }
      if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session && self.state.gate !== 'recovery' && self.state.gate !== 'in' && self.state.gate !== 'loadingData') {
        setTimeout(function () { self.afterLogin(session); }, 0);
      }
      if (event === 'INITIAL_SESSION' && !session && self.state.gate === 'loading') self.setState({ gate: 'out' });
    });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && self.state.gate === 'in' && self._loadedMs && Date.now() - self._loadedMs > 120000) self.reload(true);
    });
  }
  async afterLogin(session) {
    this.setState({ gate: 'loadingData', userEmail: session.user.email });
    try {
      var ok = await SB.rpc('is_wb_user');
      if (ok.error) throw ok.error;
      if (!ok.data) { this.setState({ gate: 'denied' }); return; }
      await loadAll();
      this._loadedMs = Date.now();
      this.setState({ gate: 'in', loadedAt: new Date().toLocaleString('zh-CN') });
    } catch (e) { this.setState({ gate: 'error', fatal: errText(e) }); }
  }
  async reload(silent) {
    try {
      if (!silent) this.setState({ busy: true });
      await loadAll();
      this._loadedMs = Date.now();
      this.setState({ busy: false, loadedAt: new Date().toLocaleString('zh-CN') });
      if (!silent) this.toast('资料已更新');
